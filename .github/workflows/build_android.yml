name: build-android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android_app/**"
      - ".github/workflows/build_android.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy's buildPython must match the app's Python (3.13); runner
      # defaults to an older python3.
      - name: Set up Python 3.13 (Chaquopy buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK (Chaquopy embeds the Python core)
        working-directory: android_app
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ncm-converter-android
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
