name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build exe
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller ncm_converter.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ncm-converter-windows
          path: dist/ncm_converter.exe

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build CLI + .app
        run: ./macos/build_macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ncm-converter-macos
          path: dist/NCM_Converter-macos.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Optional: set APK_KEYSTORE_BASE64 (+ password/alias secrets) to sign with
      # your own key; without them the APK falls back to the debug key (still installable).
      - name: Decode signing keystore
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        if: env.APK_KEYSTORE_BASE64 != ''
        working-directory: android_app/app
        run: echo "$APK_KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build release APK
        working-directory: android_app
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ncm-converter-android
          path: android_app/app/build/outputs/apk/release/*.apk

  release:
    needs: [windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
